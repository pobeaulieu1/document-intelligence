components:
  schemas:

    RevalidateResult:
      type: object
      required: [id, schema_key, enrichments]
      properties:
        id:
          type: string
          format: uuid
        schema_key:
          type: string
        enrichments:
          type: object
          additionalProperties: true

paths:

  /schemas/{key}/validation:
    get:
      summary: Get validation rules for a schema
      operationId: get_validation_rules
      tags: [validation]
      parameters:
        - $ref: "common.yaml#/components/parameters/SchemaKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/ValidationRules"
        "404":
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/HTTPError"

    put:
      summary: Replace validation rules for a schema
      operationId: update_validation_rules
      tags: [validation]
      parameters:
        - $ref: "common.yaml#/components/parameters/SchemaKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schemas.yaml#/components/schemas/ValidationRules"
      responses:
        "200":
          description: Rules updated
          content:
            application/json:
              schema:
                $ref: "schemas.yaml#/components/schemas/ValidationRules"
        "404":
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/HTTPError"
        "422":
          description: Invalid rule format
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/HTTPError"

  /schemas/{key}/documents/{id}/validate:
    post:
      summary: Re-run validation on an existing extraction
      operationId: revalidate_document
      tags: [validation]
      parameters:
        - $ref: "common.yaml#/components/parameters/SchemaKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevalidateResult"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/HTTPError"
